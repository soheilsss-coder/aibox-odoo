# Unstructured is deliberately limited to office fallbacks here. Its
# `all-docs`/`pdf` extras pull a heavyweight torch/transformers inference
# stack; PDF and image extraction are covered locally by Docling, PyMuPDF
# and RapidOCR, so that stack would add memory and cold-start cost without
# improving this appliance's certified path.
#
# --- vLLM, odoo-llm, Odoo's own requirements.txt and pgvector are
# infrastructure artifacts and MUST be supplied by the deployment
# image/build with immutable digests (VLLM_VERSION, ODOO_COMMIT_SHA,
# ODOO_LLM_COMMIT_SHA). The installer refuses to silently select a
# floating production artifact.