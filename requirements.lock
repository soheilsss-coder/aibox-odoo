# Application Python dependency lock / compatibility contract
# Runtime baseline: Python 3.12.x, Odoo 18.0
#
# This file pins the TOP-LEVEL application dependencies that the Odoo
# venv actually installs, so a rebuild installs the same versions the
# release was validated against (see 01_setup_base.sh steps [4/9] and
# [7/9]). Versions below are known-good pins for the Python 3.12/Odoo 18
# baseline; re-validate during runtime certification on the real box.

