# --- resolved extras pulled by `unstructured[all-docs]` at install time
# (the parse range ai_document_intelligence needs: pdf2image, pypdf,
# pillow, python-pptx, tabulate, xlsx2html, pandas, ...) and by
# sentence-transformers (torch, transformers, scikit-learn). These are
# the Odoo-venv consumers of step [3/9]'s app artifacts and must be
# pinned together with the release during certification.
#
# --- vLLM, odoo-llm, Odoo's own requirements.txt and pgvector are
# infrastructure artifacts and MUST be supplied by the deployment
# image/build with immutable digests (VLLM_VERSION, ODOO_COMMIT_SHA,
# ODOO_LLM_COMMIT_SHA). The installer refuses to silently select a
# floating production artifact.